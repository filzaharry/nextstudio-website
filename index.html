<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextStudio</title>

    <!-- Favicon white mode -->
    <link rel="icon" href="assets/img/NextStudio_Black.svg" media="(prefers-color-scheme: light)" />
    <!-- Favicon black mode -->
    <link rel="icon" href="assets/img/NextStudio_White.svg" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/loader.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/video.css" />
    <link rel="stylesheet" href="css/projects.css" />
    <link rel="stylesheet" href="css/services.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Component Placeholders -->
    <div id="nx-loader-wrapper"></div>

    <main>
      <div id="nx-header-wrapper"></div>
      <div id="nx-hero-wrapper"></div>
      <div id="nx-bottom-bar-wrapper"></div>

      <div id="nx-projects-wrapper"></div>
      <div id="nx-services-wrapper"></div>
    </main>

    <div id="nx-footer-wrapper"></div>
    <div id="nx-contact-modal-wrapper"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script type="module">
      import { loadComponents } from "./js/component-loader.js";
      import { initInitialLoader } from "./js/initial-loader.js";
      import { initThreeScene } from "./js/three-scene.js";

      async function init() {
        try {
          // 1. Load all HTML components
          await loadComponents();

          // 2. Initialize the loader animation
          initInitialLoader();

          // 3. Initialize Three.js scene
          initThreeScene();

          // 4. Load component scripts
          const scripts = [
            "js/main.js",
            "js/scroll-hint.js",
            "js/topbar-theme.js",
            "js/bottom-bar.js",
            "js/hero-animation.js",
            "js/projects-animation.js",
            "js/services-animation.js",
            "js/contact-modal.js",
            "js/footer-animation.js",
          ];

          let loadedCount = 0;
          scripts.forEach((src) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = () => {
              loadedCount++;
              if (loadedCount === scripts.length) {
                // 5. Dispatch event AFTER ALL scripts are loaded
                document.dispatchEvent(new CustomEvent("componentsLoaded"));
              }
            };
            document.body.appendChild(script);
          });
        } catch (error) {
          console.error("Initialization error:", error);
        }
      }

      init();
    </script>
  </body>
</html>
