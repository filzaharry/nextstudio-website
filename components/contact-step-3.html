<section class="nx-screen nx-screen-3" data-step="3">
  <div class="nx-leftBlock">
    <div class="nx-field nx-fieldMessage">
      <div class="nx-labelRow"><span class="nx-label">Message (optional)</span></div>
      <input class="nx-inputLine" id="nxMessage" name="message" placeholder="Tell us about your vision here..." />
      <div class="nx-line nx-lineStrong"></div>
    </div>

    <div class="nx-stepFooter">
      <button class="nx-navBtn" type="button" data-contact-back>
        <span class="nx-navArrow">←</span>
        <span class="nx-navText" data-back-text>Previous step</span>
      </button>
      <button class="nx-ctaBtn nx-ctaBtnSubmit" type="button" data-contact-submit>
        <span class="nx-submitText">Submit</span>
        <span class="nx-spinner" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</section>
