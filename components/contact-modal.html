<!-- CONTACT MODAL FIGMA FULL -->
<div class="nx-modal" id="nxContactModal" aria-hidden="true">
  <div class="nx-modal-backdrop" data-contact-close></div>

  <div class="nx-modal-panel" role="dialog" aria-modal="true" aria-labelledby="nxModalTitle">
    <div class="nx-modal-stage">
      <div class="nx-modal-card">
        <!-- background inside card -->
        <!-- <div class="nx-cardBg" aria-hidden="true">
          <img class="nx-cardBgImg" src="assets/img/Long_Text.svg" alt="" />
        </div> -->

        <!-- close button as IMG -->
        <button class="nx-closeBtn" type="button" data-contact-close aria-label="Close">
          <img src="assets/img/Cross.svg" alt="" />
        </button>

        <div class="nx-toast" id="nxToast"></div>

        <h2 class="nx-srOnly" id="nxModalTitle">Contact</h2>

        <!-- CONTENT AREA -->
        <div class="nx-cardInner">
          <div id="nx-step-1-wrapper"></div>
          <div id="nx-step-2-wrapper"></div>
          <div id="nx-step-3-wrapper"></div>
          <div id="nx-step-4-wrapper"></div>
        </div>

        <!-- FOOTER fixed bottom -->
        <div class="nx-cardFooter">
          <div class="nx-footerLeft">
            <!-- Buttons moved to each step -->
          </div>

          <div class="nx-footerRight">
            <span class="nx-breadcrumb">
              <span class="nx-bc bc-1">Contact information</span>
              <span class="nx-bcSep">›</span>
              <span class="nx-bc bc-2">Service(s) of interest</span>
              <span class="nx-bcSep">›</span>
              <span class="nx-bc bc-3">Submit</span>
            </span>

            <span class="nx-noteRight" data-success-note> We’ll get back to you within 24 hours with next steps. </span>

            <!-- gambar(2) posisikan di ujung kanan -->
            <img src="assets/img/Small_Logo_Black.svg" class="nx-footerImg" alt="Logo" />
          </div>
        </div>

        <div class="nx-error" data-contact-error></div>
      </div>
    </div>
  </div>
</div>
